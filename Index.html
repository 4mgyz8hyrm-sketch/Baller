<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#090d0a">
	<title>Swindon Rockets Basketball</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="./styles.css">
</head>
<body>
	<header class="topbar">
		<div class="shell topbar-inner">
			<a class="brand" href="#home" aria-label="Swindon Rockets home">
				<span class="brand-mark" aria-hidden="true">SR</span>
				<span class="brand-name">Swindon Rockets<span>Basketball Club</span></span>
			</a>
			<nav aria-label="Main navigation">
				<a href="#home" data-nav="home">Home</a>
				<a href="#squad" data-nav="squad">The Squad</a>
				<a href="#fixtures" data-nav="fixtures">Fixtures &amp; Results</a>
				<a href="#training" data-nav="training">Training</a>
				<a href="#reports" data-nav="reports">Reports</a>
				<a href="#contact" data-nav="contact">Contact</a>
			</nav>
			<span class="season-tag">2026 / 27 Season</span>
		</div>
	</header>
	<main id="app"><div class="shell loading">Loading team data...</div></main>
	<footer>
		<div class="shell footer-inner"><span><strong>SWINDON ROCKETS</strong> &nbsp;|&nbsp; Swindon, Wiltshire</span><span>Team, league, reports and contact details are illustrative placeholders.</span></div>
	</footer>
	<script>
		const teamNames = ['Swindon Rockets', 'Bath City Flyers', 'Bristol Storm', 'Oxford Hoops', 'Reading Royals', 'Gloucester Giants', 'Cheltenham Chargers', 'Chippenham Cougars'];
		const completedScores = [
			[[78, 71], [64, 69], [82, 75], [71, 66]],
			[[74, 81], [77, 70], [68, 72], [80, 76]],
			[[73, 67], [79, 84], [70, 62], [75, 78]],
			[[85, 74], [66, 71], [76, 69], [72, 80]],
			[[77, 69], [72, 80], [84, 76], [65, 71]],
			[[81, 74], [68, 75], [79, 70], [73, 82]],
			[[70, 66], [83, 78], [74, 81], [76, 69]],
			[[88, 79], [71, 77], [80, 73], [67, 74]]
		];
		const reportStories = {
			1: { title: 'Rockets open with a home-court win', summary: 'Swindon set the tone early and held off a late Chippenham push in the season opener.', body: 'The Rockets began their 2026/27 campaign in front of the home crowd with a composed 78–71 win over the Chippenham Cougars. Swindon built an early cushion by moving the ball patiently and turning stops into quick chances.\n\nChippenham made a run after the break, but the Rockets kept their shape, found timely scores and closed out the first result of the season.' },
			2: { title: 'Road win shows Rockets resolve', summary: 'A strong finish carried Swindon past Cheltenham in a close away contest.', body: 'Swindon came away from Cheltenham with an 81–74 win after a determined second-half response. The Chargers kept the game tight on their home floor, but the Rockets found better looks as the contest wore on.\n\nComposure at the line and a run of defensive stops helped Swindon protect its lead through the closing minutes.' },
			3: { title: 'Defence leads the way against Gloucester', summary: 'The Rockets kept the Giants to 67 points and made their home advantage count.', body: 'The Rockets made defence the starting point in a 73–67 home win over Gloucester. Swindon contested shots across the floor and limited the Giants’ second chances, creating room to build a lead over four quarters.\n\nGloucester stayed within reach late, but the home side handled the final possessions to make it three wins from three.' },
			4: { title: 'Reading edge a high-scoring battle', summary: 'The Royals found their rhythm at home to hand Swindon its first defeat.', body: 'Swindon’s unbeaten start ended with an 85–74 loss at Reading. The Rockets traded baskets with the Royals early, but Reading created separation after the interval and made its home-court run count.\n\nThere were bright spells in attack for Swindon, though the visitors could not quite close the gap in the fourth quarter.' },
			5: { title: 'Rockets bounce back at home', summary: 'A balanced team performance delivered a 77–69 result against Oxford Hoops.', body: 'Swindon returned to the home floor and responded with a 77–69 win over Oxford. The Rockets shared the scoring and kept the Hoops from building momentum, turning a competitive first half into a more controlled finish.\n\nThe result was a useful reset for the group and another strong night in front of the Swindon support.' },
			6: { title: 'Bristol hold on as Rockets rally', summary: 'Swindon fought back on the road, but the Storm did enough to keep the points.', body: 'The Rockets pushed Bristol all the way before falling 81–74 on the road. The Storm made the most of a strong stretch in the middle quarters, leaving Swindon with ground to make up late.\n\nThe visitors kept competing and trimmed the margin, but Bristol’s early work proved decisive.' },
			7: { title: 'Rockets grind out a close one', summary: 'A four-point home win over Bath came down to disciplined defence late on.', body: 'Swindon earned a hard-fought 70–66 win against Bath City Flyers. Neither side found much separation, and the game stayed within a single run deep into the final quarter.\n\nThe Rockets made the key stops when they mattered and held their nerve to keep the result at home.' },
			8: { title: 'Cougars take the rematch in Chippenham', summary: 'Swindon’s late push fell short in an 88–79 road loss.', body: 'The Rockets returned to Chippenham for the reverse fixture and came away with a 79–88 defeat. The Cougars converted a productive home stretch into a lead, while Swindon had to chase the game through the second half.\n\nThe Rockets found points late and narrowed the gap, but Chippenham closed out the rematch.' }
		};

		function buildRounds() {
			let rotation = teamNames.map((_, index) => index);
			const firstLeg = [];
			for (let round = 0; round < teamNames.length - 1; round += 1) {
				const games = [];
				for (let game = 0; game < teamNames.length / 2; game += 1) {
					let home = rotation[game];
					let away = rotation[teamNames.length - 1 - game];
					if ((round + game) % 2) [home, away] = [away, home];
					games.push({ home, away });
				}
				firstLeg.push(games);
				rotation = [rotation[0], rotation[rotation.length - 1], ...rotation.slice(1, -1)];
			}
			return [...firstLeg, ...firstLeg.map(games => games.map(({ home, away }) => ({ home: away, away: home })))];
		}

		const rounds = buildRounds().map((games, roundIndex) => ({
			number: roundIndex + 1,
			date: new Date(Date.UTC(2026, 7, 1 + roundIndex * 7)).toISOString(),
			games: games.map((game, gameIndex) => ({
				...game,
				homeName: teamNames[game.home],
				awayName: teamNames[game.away],
				score: roundIndex < completedScores.length ? completedScores[roundIndex][gameIndex] : null
			}))
		}));

		function allGames() { return rounds.flatMap(round => round.games.map(game => ({ ...game, round: round.number, date: round.date }))); }
		function tableRows() {
			const table = Object.fromEntries(teamNames.map(name => [name, { name, played: 0, wins: 0, losses: 0, pointsFor: 0, pointsAgainst: 0 }]));
			for (const game of allGames().filter(match => match.score)) {
				const [homeScore, awayScore] = game.score;
				const home = table[game.homeName];
				const away = table[game.awayName];
				home.played += 1; away.played += 1;
				home.pointsFor += homeScore; home.pointsAgainst += awayScore;
				away.pointsFor += awayScore; away.pointsAgainst += homeScore;
				if (homeScore > awayScore) { home.wins += 1; away.losses += 1; }
				else { away.wins += 1; home.losses += 1; }
			}
			return Object.values(table).sort((a, b) => b.wins - a.wins || (b.pointsFor - b.pointsAgainst) - (a.pointsFor - a.pointsAgainst));
		}

		const fmtDate = value => new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' }).format(new Date(value));
		const longDate = value => new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }).format(new Date(value));
		const app = document.querySelector('#app');
		let players = [];

		function renderStandings() {
			return `<div class="table-wrap"><table class="standings"><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>L</th></tr></thead><tbody>${tableRows().map((row, index) => `<tr class="${row.name === 'Swindon Rockets' ? 'rockets' : ''}"><td>${index + 1}</td><td>${row.name}</td><td>${row.played}</td><td>${row.wins}</td><td>${row.losses}</td></tr>`).join('')}</tbody></table></div>`;
		}

		function gameRow(game, schedule = false) {
			const date = `<span class="fixture-date"><strong>${fmtDate(game.date)}</strong>${schedule ? `Round ${game.round}` : 'League'}</span>`;
			const match = `<span class="fixture-match">${game.homeName} <small>vs</small> ${game.awayName}</span>`;
			const score = game.score ? `<span class="score">${game.score[0]} – ${game.score[1]}</span>` : '<span class="score upcoming">Upcoming</span>';
			return `<div class="fixture-row">${date}${match}${score}</div>`;
		}

		function renderHome() {
			const recent = allGames().filter(game => game.score).slice(-4).reverse();
			const next = allGames().filter(game => !game.score && (game.homeName === 'Swindon Rockets' || game.awayName === 'Swindon Rockets')).slice(0, 3);
			return `<section class="hero"><div class="shell hero-content"><div class="eyebrow">Swindon, Wiltshire &nbsp;·&nbsp; Est. 2024</div><h1>Built to<br><span>take flight.</span></h1><p class="hero-copy">A new era of basketball in Swindon. Meet your hometown team and follow every fixture, result and rising star.</p><div class="hero-actions"><a class="button" href="#squad">Meet the team <span aria-hidden="true">↗</span></a><a class="button secondary" href="#fixtures">Fixtures &amp; results</a></div></div></section>
				<section class="shell content"><div class="home-grid"><div class="feature-panel"><div class="section-heading"><div><div class="eyebrow">On the court</div><h2>Recent results</h2></div><a class="text-link" href="#reports">Match reports ↗</a></div><div class="fixture-list">${recent.map(game => gameRow(game)).join('')}</div><div style="height:22px"></div><div class="section-heading"><div><div class="eyebrow">Next up</div><h2>Coming soon</h2></div></div><div class="fixture-list">${next.map(game => gameRow(game)).join('')}</div></div><aside><div class="section-heading"><div><div class="eyebrow">The table</div><h2>League standings</h2></div></div>${renderStandings()}<p class="placeholder-note">Illustrative results and standings for a fictional eight-team league.</p></aside></div></section>`;
		}

		function renderSquad() {
			return `<section class="shell"><div class="page-intro"><div><div class="eyebrow">One city. One team.</div><h1>Meet the squad</h1></div><p>Get to know the players representing Swindon. Select a player for their profile, season stats and court bio.</p></div><div class="player-grid">${players.map(player => `<a class="player-card" href="#player/${encodeURIComponent(player.id)}"><div class="player-card-top"><span class="player-number">${String(player.number).padStart(2, '0')}</span><span class="player-position">${player.position}</span></div><h2>${player.name}</h2><span class="player-meta">${player.height} &nbsp;·&nbsp; ${player.year}</span><div class="player-statline"><span>PPG<strong>${player.stats.ppg}</strong></span><span>RPG<strong>${player.stats.rpg}</strong></span><span>APG<strong>${player.stats.apg}</strong></span></div></a>`).join('')}</div><p class="placeholder-note">Player names and statistics are sample data for this placeholder site.</p></section>`;
		}

		function renderPlayer(id) {
			const player = players.find(item => item.id === id);
			if (!player) return `<section class="shell"><div class="empty-state"><div class="eyebrow">Player profile</div><h1>Player not found</h1><a class="back-link" href="#squad">← Back to the squad</a></div></section>`;
			return `<section class="shell profile"><div class="profile-identity"><div class="eyebrow">Swindon Rockets &nbsp;·&nbsp; #${player.number}</div><div class="profile-number">${String(player.number).padStart(2, '0')}</div><h1>${player.name}</h1><div class="profile-position">${player.position}</div><div class="profile-facts"><div><span>Height</span><strong>${player.height}</strong></div><div><span>Experience</span><strong>${player.year}</strong></div><div><span>From</span><strong>${player.hometown}</strong></div></div></div><div class="profile-details"><div class="eyebrow">Player profile</div><h2>On the rise</h2><p class="bio">${player.bio}</p><div class="eyebrow" style="margin-top:28px">Season averages</div><div class="stats-grid">${[['PPG', player.stats.ppg], ['RPG', player.stats.rpg], ['APG', player.stats.apg], ['FG%', `${player.stats.fgPct}%`], ['3PT%', `${player.stats.threePct}%`], ['SPG', player.stats.spg]].map(([label, value]) => `<div class="stat"><strong>${value}</strong><span>${label}</span></div>`).join('')}</div><a class="back-link" href="#squad">← All players</a></div></section>`;
		}

		function renderFixtures() {
			return `<section class="shell"><div class="page-intro"><div><div class="eyebrow">2026 / 27 season</div><h1>Fixtures &amp; results</h1></div><p>Fourteen rounds. Eight teams. Every club meets home and away. Sample scores are marked as played; remaining games are upcoming.</p></div><div class="schedule">${rounds.map(round => `<section class="round"><h2 class="round-title">Round ${String(round.number).padStart(2, '0')} <span>${fmtDate(round.date)}</span></h2><div class="fixture-list">${round.games.map(game => gameRow({ ...game, date: round.date, round: round.number }, true)).join('')}</div></section>`).join('')}</div></section>`;
		}

		function rocketsReports() {
			return allGames().filter(game => game.score && (game.home === 0 || game.away === 0))
				.map(game => ({ ...game, story: reportStories[game.round] })).reverse();
		}

		function renderReports() {
			return `<section class="shell"><div class="page-intro"><div><div class="eyebrow">From the court</div><h1>Match reports</h1></div><p>Dated recaps from every completed Swindon Rockets league game. All scores and coverage are fictional placeholders.</p></div><div class="report-list">${rocketsReports().map(game => {
				const rocketsScore = game.home === 0 ? game.score[0] : game.score[1];
				const opponentScore = game.home === 0 ? game.score[1] : game.score[0];
				return `<a class="report-card" href="#report/${game.round}"><div class="report-meta"><span>${longDate(game.date)}</span><span class="report-scoreline">${rocketsScore} – ${opponentScore}</span></div><h2>${game.story.title}</h2><p>${game.story.summary}</p></a>`;
			}).join('')}</div></section>`;
		}

		function renderReport(roundNumber) {
			const game = rocketsReports().find(match => match.round === Number(roundNumber));
			if (!game) return `<section class="shell empty-state"><h1>Report not found</h1><a class="back-link" href="#reports">← All match reports</a></section>`;
			const rocketsScore = game.home === 0 ? game.score[0] : game.score[1];
			const opponentScore = game.home === 0 ? game.score[1] : game.score[0];
			const opponent = game.home === 0 ? game.awayName : game.homeName;
			return `<article class="shell report-detail"><a class="back-link" href="#reports">← All match reports</a><div class="eyebrow" style="margin-top:28px">Round ${game.round} &nbsp;·&nbsp; ${game.home === 0 ? 'Home' : 'Away'} vs ${opponent}</div><div class="report-scoreline">Swindon ${rocketsScore} – ${opponentScore} ${opponent}</div><h1>${game.story.title}</h1><div class="report-meta"><span>${longDate(game.date)}</span><span>2026 / 27 Season</span></div><div class="report-body">${game.story.body.split('\n\n').map(paragraph => `<p>${paragraph}</p>`).join('')}</div></article>`;
		}

		function renderTraining() {
			const sessions = [
				{ day: 'Tuesday', session: 'Development session', audience: 'U16, U18 & development squad', time: '18:30 – 20:00', venue: 'Rockets Community Court' },
				{ day: 'Thursday', session: 'Senior team practice', audience: 'Senior squad & invited players', time: '19:00 – 21:00', venue: 'Rockets Community Court' },
				{ day: 'Saturday', session: 'Open court', audience: 'All abilities, ages 16+', time: '10:00 – 11:30', venue: 'Rockets Community Court' }
			];
			return `<section class="shell"><div class="page-intro"><div><div class="eyebrow">Get in the gym</div><h1>Training schedule</h1></div><p>Weekly sessions for developing players, the senior squad and anyone looking to get on court.</p></div><div class="training-list">${sessions.map(session => `<div class="training-row"><div class="training-day">${session.day}</div><div class="training-session"><h2>${session.session}</h2><p>${session.audience}</p></div><div class="training-time">${session.time}<span>${session.venue}</span></div></div>`).join('')}</div><p class="placeholder-note">Session times and venue are illustrative placeholders. Please confirm details before attending.</p></section>`;
		}

		function renderContact() {
			return `<section class="shell"><div class="page-intro"><div><div class="eyebrow">Say hello</div><h1>Contact the club</h1></div><p>Questions about joining, training or supporting the Rockets? Send the team a message.</p></div><div class="contact-layout"><div class="contact-details"><div class="contact-item"><span>Email</span><a href="mailto:hello@swindonrockets.example">hello@swindonrockets.example</a></div><div class="contact-item"><span>Based in</span><strong>Swindon, Wiltshire</strong></div><div class="contact-item"><span>Training venue</span><strong>Rockets Community Court</strong></div><p class="placeholder-note">Contact details are placeholders and are not monitored.</p></div><form class="contact-form" id="contact-form"><label>Name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label class="full">Subject<input name="subject" required></label><label class="full">Message<textarea name="message" required></textarea></label><button class="button" type="submit">Write to the club <span aria-hidden="true">↗</span></button></form></div></section>`;
		}

		function render() {
			const route = decodeURIComponent(location.hash.slice(1) || 'home');
			const [page, id] = route.split('/');
			document.querySelectorAll('[data-nav]').forEach(link => link.classList.toggle('active', link.dataset.nav === (page.startsWith('player') ? 'squad' : page.startsWith('report') ? 'reports' : page)));
			app.innerHTML = page === 'squad' ? renderSquad() : page === 'fixtures' ? renderFixtures() : page === 'player' ? renderPlayer(id) : page === 'training' ? renderTraining() : page === 'reports' ? renderReports() : page === 'report' ? renderReport(id) : page === 'contact' ? renderContact() : renderHome();
			window.scrollTo(0, 0);
		}

		document.addEventListener('submit', event => {
			if (event.target.id !== 'contact-form') return;
			event.preventDefault();
			const fields = new FormData(event.target);
			const subject = encodeURIComponent(fields.get('subject'));
			const body = encodeURIComponent(`From: ${fields.get('name')} <${fields.get('email')}>\n\n${fields.get('message')}`);
			window.location.href = `mailto:hello@swindonrockets.example?subject=${subject}&body=${body}`;
		});

		fetch('./players.json')
			.then(response => { if (!response.ok) throw new Error(`Could not load players.json (${response.status})`); return response.json(); })
			.then(data => { players = data.players; render(); })
			.catch(error => { app.innerHTML = `<div class="shell empty-state">Team data could not be loaded. Open this site through a local web server to load players.json.<br><small>${error.message}</small></div>`; });
		window.addEventListener('hashchange', render);
	</script>
</body>
</html>
